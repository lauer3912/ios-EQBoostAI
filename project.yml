name: SoulSync
options:
  bundleIdPrefix: com.ggsheng
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateOnly: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "9L6N2ZF26B"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  SnapKit:
    url: https://github.com/SnapKit/SnapKit.git
    from: "5.6.0"
  SQLite:
    url: https://github.com/stephencelis/SQLite.swift.git
    from: "0.14.1"
  DGCharts:
    url: https://github.com/ChartsOrg/Charts.git
    from: "5.0.0"

targets:
  SoulSync:
    type: application
    platform: iOS
    sources:
      - App
      - Screens
      - Components
      - Models
      - Services
      - Utilities
      - Resources
    dependencies:
      - package: SnapKit
      - package: SQLite
      - package: DGCharts
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ggsheng.SoulSync
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ""
    entitlements:
      path: Resources/SoulSync.entitlements
      properties:
        com.apple.developer.applesignin: []

  SoulSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/SoulSyncTests
    dependencies:
      - target: SoulSync

  SoulSyncUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/SoulSyncUITests
    dependencies:
      - target: SoulSync

schemes:
  SoulSync:
    build:
      targets:
        SoulSync: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SoulSyncTests
        - SoulSyncUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release