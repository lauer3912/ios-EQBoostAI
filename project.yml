name: EQBoostAI
options:
  bundleIdPrefix: com.ggsheng
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 9L6N2ZF26B
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  SnapKit:
    url: https://github.com/SnapKit/SnapKit.git
    version: "5.7.1"
  DGCharts:
    url: https://github.com/ChartsOrg/Charts.git
    version: "5.1.0"

targets:
  EQBoostAI:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Screens
      - path: Components
      - path: Models
      - path: Services
      - path: Utilities
      - path: Resources
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ggsheng.EQBoostAI
        PRODUCT_NAME: EQBoostAI
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: Resources/EQBoostAI.entitlements
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGNING_ALLOWED: YES
    entitlements:
      path: Resources/EQBoostAI.entitlements
    dependencies:
      - package: SnapKit
      - package: DGCharts

  EQBoostAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/EQBoostAITests
    dependencies:
      - target: EQBoostAI
    settings:
      base:
        INFOPLIST_FILE: Tests/EQBoostAITests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ggsheng.EQBoostAITests
        PRODUCT_NAME: EQBoostAITests
        GENERATE_INFOPLIST_FILE: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/EQBoostAI.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/EQBoostAI"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9L6N2ZF26B
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGNING_ALLOWED: YES

  EQBoostAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/EQBoostAIUITests
    dependencies:
      - target: EQBoostAI
    settings:
      base:
        INFOPLIST_FILE: Tests/EQBoostAIUITests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ggsheng.EQBoostAIUITests
        PRODUCT_NAME: EQBoostAIUITests
        GENERATE_INFOPLIST_FILE: NO
        TEST_TARGET: "$(BUILT_PRODUCTS_DIR)/EQBoostAI.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/EQBoostAI"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9L6N2ZF26B
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGNING_ALLOWED: YES

schemes:
  EQBoostAI:
    build:
      targets:
        EQBoostAI: all
        EQBoostAIUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EQBoostAIUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release