name: EQBoostAI
options:
  bundleIdPrefix: com.ggsheng
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateOnly: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "9L6N2ZF26B"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  SnapKit:
    url: https://github.com/SnapKit/SnapKit.git
    from: "5.6.0"
  SQLite:
    url: https://github.com/stephencelis/SQLite.swift.git
    exactVersion: "0.14.1"
  DGCharts:
    url: https://github.com/ChartsOrg/Charts.git
    from: "5.0.0"

targets:
  EQBoostAI:
    type: application
    platform: iOS
    sources:
      - App
      - Screens
      - Components
      - Models
      - Services
      - Utilities
      - Resources
    dependencies:
      - package: SnapKit
      - package: SQLite
      - package: DGCharts
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ggsheng.EQBoostAI
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  EQBoostAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/EQBoostAITests
    dependencies:
      - target: EQBoostAI

  EQBoostAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/EQBoostAIUITests
    dependencies:
      - target: EQBoostAI

schemes:
  EQBoostAI:
    build:
      targets:
        EQBoostAI: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EQBoostAITests
        - EQBoostAIUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release